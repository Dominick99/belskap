services:
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://belskap:belskap@db:5432/belskap
      JWT_SECRET: local-docker-secret-change-before-production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: belskap
      POSTGRES_USER: belskap
      POSTGRES_PASSWORD: belskap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belskap -d belskap"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
