services:
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://belskap:belskap@db:5432/belskap
      JWT_SECRET: local-docker-secret-change-before-production
      S3_ENDPOINT_URL: http://storage:9000
      S3_ACCESS_KEY: belskap
      S3_SECRET_KEY: local-storage-secret
      S3_BUCKET: belskap-media
      S3_REGION: us-east-1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy

  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: belskap
      MINIO_ROOT_PASSWORD: local-storage-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - media_data:/data

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: belskap
      POSTGRES_USER: belskap
      POSTGRES_PASSWORD: belskap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belskap -d belskap"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres18_data:/var/lib/postgresql

volumes:
  postgres18_data:
  media_data:
